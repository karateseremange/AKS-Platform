<style>
  :root {
    --aks-primary: #2a4b9b;
    --aks-primary-dark: #1f3978;
    --aks-background: #f4f6fa;
    --aks-surface: #fff;
    --aks-text: #172033;
    --aks-muted: #667085;
    --aks-border: #dfe4ec;
    --aks-success: #176b43;
    --aks-danger: #a4262c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--aks-background); color: var(--aks-text); font-family: Arial, Helvetica, sans-serif; }
  .aks-config-shell { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 64px; }
  .aks-config-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 24px; }
  .aks-config-eyebrow, .aks-config-key { margin: 0 0 6px; color: var(--aks-primary); font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  h1, h2, p { margin-top: 0; }
  h1 { margin-bottom: 8px; }
  .aks-config-header > div > p:last-child { color: var(--aks-muted); }
  .aks-config-back { padding: 11px 14px; border: 1px solid var(--aks-border); border-radius: 9px; background: var(--aks-surface); color: var(--aks-primary-dark); font-weight: 700; text-decoration: none; }
  .aks-config-message { min-height: 24px; margin-bottom: 16px; font-weight: 700; }
  .aks-config-message--success { color: var(--aks-success); }
  .aks-config-message--error { color: var(--aks-danger); }
  .aks-config-list { display: grid; gap: 18px; }
  .aks-config-card { padding: 24px; border: 1px solid var(--aks-border); border-radius: 16px; background: var(--aks-surface); box-shadow: 0 10px 28px rgba(23,32,51,.06); }
  .aks-config-card__heading { display: flex; justify-content: space-between; gap: 16px; }
  .aks-config-card h2 { margin-bottom: 0; font-size: 1.18rem; }
  .aks-config-source { height: fit-content; padding: 5px 9px; border-radius: 999px; background: #edf2ff; color: var(--aks-primary-dark); font-size: .76rem; font-weight: 700; }
  .aks-config-source--invalid { background: #fff1f1; color: var(--aks-danger); }
  .aks-config-description { margin: 14px 0; color: var(--aks-muted); }
  .aks-config-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 18px; font-size: .84rem; }
  .aks-config-meta div { display: flex; gap: 6px; }
  .aks-config-meta dt { color: var(--aks-muted); }
  .aks-config-meta dd { margin: 0; font-weight: 700; }
  .aks-config-form { display: grid; gap: 9px; }
  .aks-config-form label { font-weight: 700; }
  .aks-config-form input, .aks-config-form select { width: 100%; padding: 11px 12px; border: 1px solid #b8c0cf; border-radius: 8px; background: #fff; color: var(--aks-text); font: inherit; }
  .aks-config-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
  .aks-config-actions button { padding: 11px 15px; border: 0; border-radius: 8px; background: var(--aks-primary); color: #fff; font-weight: 700; cursor: pointer; }
  .aks-config-actions .aks-config-reset { border: 1px solid var(--aks-border); background: #fff; color: var(--aks-primary-dark); }
  .aks-config-readonly, .aks-config-sensitive { margin-bottom: 0; padding: 13px; border-radius: 8px; background: #f7f9fc; }
  .aks-config-readonly span { display: block; margin-top: 4px; color: var(--aks-muted); font-size: .82rem; }
  @media (max-width: 700px) {
    .aks-config-shell { width: min(100% - 24px, 1040px); padding-top: 24px; }
    .aks-config-header { flex-direction: column; }
    .aks-config-back { width: 100%; text-align: center; }
  }
</style>
