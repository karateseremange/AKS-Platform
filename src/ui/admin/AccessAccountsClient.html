<script>(function(){"use strict";
var shell=document.querySelector(".aks-access"),list=document.getElementById("access-list"),count=document.getElementById("access-count"),message=document.getElementById("aks-access-message"),detail=document.getElementById("access-detail"),form=document.getElementById("access-detail-form"),previewBox=document.getElementById("access-preview-result"),previewSummary=document.getElementById("access-preview-summary"),saveButton=document.getElementById("access-save"),historyList=document.getElementById("access-history-list"),historyMore=document.getElementById("access-history-more"),timer,currentDetail,currentPreview,historyCursor;
function esc(v){var d=document.createElement("div");d.textContent=String(v||"");return d.innerHTML;}
function attr(v){return esc(v).replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function query(){return{search:document.getElementById("access-search").value,status:document.getElementById("access-status").value,role:document.getElementById("access-role").value,module:document.getElementById("access-module").value,temporalState:document.getElementById("access-temporal").value};}
function busy(value){shell.setAttribute("aria-busy",value?"true":"false");}
function fail(error){busy(false);message.textContent=error&&error.message?error.message:"L’opération a échoué. Actualisez la liste puis réessayez.";message.className="error";}
function render(data){busy(false);shell.dataset.revision=data.revision;count.textContent=data.resultCount+" résultat(s) sur "+data.totalCount;if(!data.accounts.length){list.innerHTML="<p>Aucun compte ne correspond aux critères.</p>";return;}list.innerHTML=data.accounts.map(function(a){var action=a.status==="ACTIVE"?"<button data-action=\"deactivate\">Désactiver</button>":"<button data-action=\"reactivate\">Réactiver</button>";return"<article class=\"account\" data-id=\""+encodeURIComponent(a.accountId)+"\" data-assignments=\""+Number(a.assignmentCount)+"\"><div class=\"account__head\"><div><h2>"+esc(a.displayName)+"</h2><p>"+esc(a.accountId)+"</p></div><strong>"+esc(a.status)+"</strong></div><div class=\"badges\">"+a.roles.concat(a.effectiveModules).map(function(x){return"<span class=\"badge\">"+esc(x)+"</span>";}).join("")+"</div><p>"+a.effectiveAssignmentCount+" habilitation(s) effective(s) — "+esc(a.temporalState)+"</p><button data-action=\"manage\">Gérer les habilitations</button>"+action+"</article>";}).join("");}
function load(){busy(true);google.script.run.withSuccessHandler(render).withFailureHandler(fail).AKS_listAdminAccessAccounts(query());}
function requestId(){return"req-ui-"+Date.now()+"-"+Math.random().toString(36).slice(2);}
function command(name,payload){if(shell.getAttribute("aria-busy")==="true")return;busy(true);payload.expectedRevision=shell.dataset.revision;payload.requestId=requestId();google.script.run.withSuccessHandler(function(){message.textContent="Modification enregistrée.";message.className="success";load();}).withFailureHandler(fail)[name](payload);}
function checks(values,selected,name){return"<div class=\"access-checks wide\">"+values.map(function(value){return"<label><input type=\"checkbox\" name=\""+name+"\" value=\""+attr(value)+"\" "+(selected.indexOf(value)!==-1?"checked":"")+"> "+esc(value)+"</label>";}).join("")+"</div>";}
function blank(module){return{module:module,season:module==="ANALYTICS"||module==="ACCESS"?"*":"",section:"",courseCode:"",status:"ACTIVE",roles:currentDetail.account.roles.slice(0,1),capabilities:module==="ACCESS"?["ACCESS_MANAGE"]:[],validFrom:"",validUntil:""};}
function row(a,index){var catalogue=currentDetail.catalogues.modules[a.module],scope=catalogue.scope||[],html="<div class=\"access-assignment\" data-index=\""+index+"\" data-module=\""+attr(a.module)+"\">";if(scope.indexOf("season")!==-1)html+="<label>Saison<input name=\"season\" value=\""+attr(a.season)+"\" placeholder=\"2026-2027\"></label>";if(scope.indexOf("section")!==-1)html+="<label>Section<input name=\"section\" value=\""+attr(a.section)+"\"></label>";if(scope.indexOf("courseCode")!==-1)html+="<label>Cours<input name=\"courseCode\" value=\""+attr(a.courseCode)+"\"></label>";html+="<label>Début<input type=\"date\" name=\"validFrom\" value=\""+attr(a.validFrom)+"\"></label><label>Fin<input type=\"date\" name=\"validUntil\" value=\""+attr(a.validUntil)+"\"></label>"+checks(currentDetail.catalogues.roles,a.roles,"assignmentRole")+checks(catalogue.capabilities,a.capabilities,"capability")+"<button type=\"button\" data-remove>Retirer cette habilitation</button></div>";return html;}
function renderAssignments(){document.querySelectorAll(".access-card").forEach(function(card){var module=card.dataset.module,existing=currentDetail.account.assignments.some(function(a){return a.module===module;});card.querySelector(".access-card__rows").innerHTML=currentDetail.account.assignments.map(function(a,i){return a.module===module?row(a,i):"";}).join("");card.querySelector("[data-add]").disabled=!currentDetail.account.editable||(module==="ACCESS"&&existing);});}
function openDetail(data){busy(false);currentDetail=data;currentPreview=null;historyCursor="";historyList.innerHTML="";historyMore.hidden=true;detail.hidden=false;previewBox.hidden=true;document.getElementById("access-detail-title").textContent=data.account.displayName||"Habilitations";document.getElementById("access-detail-identity").textContent=data.account.accountId+" — "+data.account.status;document.getElementById("access-detail-roles").innerHTML="<legend>Rôles descriptifs</legend>"+checks(data.catalogues.roles,data.account.roles,"accountRole");document.getElementById("access-preview").disabled=!data.account.editable;renderAssignments();detail.scrollIntoView({behavior:"smooth",block:"start"});}
function assignmentFrom(row){function selected(name){return Array.prototype.slice.call(row.querySelectorAll("input[name='"+name+"']:checked")).map(function(input){return input.value;});}function value(name){var input=row.querySelector("[name='"+name+"']");return input?input.value:"";}return{module:row.dataset.module,season:row.dataset.module==="ANALYTICS"||row.dataset.module==="ACCESS"?"*":value("season"),section:value("section"),courseCode:value("courseCode"),status:"ACTIVE",roles:selected("assignmentRole"),capabilities:selected("capability"),validFrom:value("validFrom"),validUntil:value("validUntil")};}
function payload(){return{accountId:currentDetail.account.accountId,expectedRevision:currentDetail.revision,roles:Array.prototype.slice.call(document.querySelectorAll("#access-detail-roles input:checked")).map(function(input){return input.value;}),assignments:Array.prototype.slice.call(document.querySelectorAll(".access-assignment")).map(assignmentFrom),comment:document.getElementById("access-detail-comment").value};}
function showPreview(data){busy(false);currentPreview=data;previewBox.hidden=false;var s=data.summary;previewSummary.innerHTML="<p>Rôles ajoutés : "+esc(s.rolesAdded.join(", ")||"aucun")+"</p><p>Rôles retirés : "+esc(s.rolesRemoved.join(", ")||"aucun")+"</p><p>Habilitations ajoutées : "+s.assignmentsAdded.length+"</p><p>Habilitations retirées : "+s.assignmentsRemoved.length+"</p>";saveButton.disabled=!data.changed;previewBox.scrollIntoView({behavior:"smooth",block:"nearest"});}
function renderHistory(data){busy(false);historyCursor=data.nextCursor;historyMore.hidden=!data.hasMore;if(!data.entries.length&&!historyList.children.length){historyList.innerHTML="<p>Aucune modification enregistrée pour ce compte.</p>";return;}historyList.insertAdjacentHTML("beforeend",data.entries.map(function(entry){var s=entry.summary;return"<article class=\"access-history__entry\"><p><strong>"+esc(entry.occurredAt)+" — "+esc(entry.result)+"</strong></p><p>"+esc(entry.operation)+" par "+esc(entry.actor)+"</p><p>Rôles +"+esc(s.rolesAdded.join(", ")||"aucun")+" / -"+esc(s.rolesRemoved.join(", ")||"aucun")+"</p><p>Habilitations +"+Number(s.assignmentsAdded)+" / -"+Number(s.assignmentsRemoved)+(s.restored?" — restauration":"")+"</p>"+(entry.comment?"<p>Commentaire : "+esc(entry.comment)+"</p>":"")+"</article>";}).join(""));}
function loadHistory(reset){if(!currentDetail)return;if(reset){historyCursor="";historyList.innerHTML="";}busy(true);google.script.run.withSuccessHandler(renderHistory).withFailureHandler(fail).AKS_getAdminAccessAccountHistory(currentDetail.account.accountId,historyCursor);}
document.querySelectorAll(".toolbar input,.toolbar select").forEach(function(control){control.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(load,250);});});
document.getElementById("access-create").addEventListener("submit",function(e){e.preventDefault();if(!window.confirm("Créer ce compte inactif, sans habilitation ?"))return;command("AKS_createAdminAccessAccount",{displayName:this.elements.displayName.value,email:this.elements.email.value,role:this.elements.role.value});});
list.addEventListener("click",function(e){var button=e.target.closest("button[data-action]");if(!button)return;var card=button.closest("[data-id]"),id=decodeURIComponent(card.dataset.id),action=button.dataset.action;if(action==="manage"){busy(true);google.script.run.withSuccessHandler(openDetail).withFailureHandler(fail).AKS_getAdminAccessAccountDetail(id);return;}if(action==="deactivate"){if(window.confirm("Désactiver ce compte en conservant son historique ?"))command("AKS_deactivateAdminAccessAccount",{accountId:id});return;}var clear=Number(card.dataset.assignments)>0;if(window.confirm(clear?"Réactiver ce compte et effacer définitivement ses anciennes habilitations ?":"Réactiver ce compte sans habilitation ?"))command("AKS_reactivateAdminAccessAccount",{accountId:id,clearAssignments:clear});});
detail.addEventListener("click",function(e){var add=e.target.closest("[data-add]"),remove=e.target.closest("[data-remove]");if(add){currentDetail.account.assignments.push(blank(add.dataset.add));renderAssignments();previewBox.hidden=true;}if(remove){currentDetail.account.assignments.splice(Number(remove.closest("[data-index]").dataset.index),1);renderAssignments();previewBox.hidden=true;}});
document.getElementById("access-detail-close").addEventListener("click",function(){detail.hidden=true;currentDetail=null;});
document.getElementById("access-history-load").addEventListener("click",function(){loadHistory(true);});
historyMore.addEventListener("click",function(){loadHistory(false);});
form.addEventListener("submit",function(e){e.preventDefault();busy(true);google.script.run.withSuccessHandler(showPreview).withFailureHandler(fail).AKS_previewAdminAccessAccount(payload());});
saveButton.addEventListener("click",function(){if(!currentPreview||!currentPreview.changed)return;if(!window.confirm("Confirmer l’enregistrement des rôles et habilitations affichés dans la synthèse ?"))return;var data=payload();data.requestId=requestId();data.confirmSensitive=true;busy(true);google.script.run.withSuccessHandler(function(result){message.textContent="Habilitations enregistrées — corrélation "+result.correlationId;message.className="success";detail.hidden=true;load();}).withFailureHandler(fail).AKS_saveAdminAccessAccount(data);});load();
})();</script>
