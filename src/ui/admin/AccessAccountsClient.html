<script>(function(){"use strict";
var shell=document.querySelector(".aks-access"),list=document.getElementById("access-list"),count=document.getElementById("access-count"),message=document.getElementById("aks-access-message"),timer;
function esc(v){var d=document.createElement("div");d.textContent=String(v||"");return d.innerHTML;}
function query(){return{search:document.getElementById("access-search").value,status:document.getElementById("access-status").value,role:document.getElementById("access-role").value,module:document.getElementById("access-module").value,temporalState:document.getElementById("access-temporal").value};}
function fail(){shell.setAttribute("aria-busy","false");message.textContent="L’opération a échoué. Actualisez la liste puis réessayez.";message.className="error";}
function render(data){shell.setAttribute("aria-busy","false");shell.dataset.revision=data.revision;count.textContent=data.resultCount+" résultat(s) sur "+data.totalCount;if(!data.accounts.length){list.innerHTML="<p>Aucun compte ne correspond aux critères.</p>";return;}list.innerHTML=data.accounts.map(function(a){var action=a.status==="ACTIVE"?"<button data-action=\"deactivate\">Désactiver</button>":"<button data-action=\"reactivate\">Réactiver</button>";return"<article class=\"account\" data-id=\""+encodeURIComponent(a.accountId)+"\" data-assignments=\""+Number(a.assignmentCount)+"\"><div class=\"account__head\"><div><h2>"+esc(a.displayName)+"</h2><p>"+esc(a.accountId)+"</p></div><strong>"+esc(a.status)+"</strong></div><div class=\"badges\">"+a.roles.concat(a.effectiveModules).map(function(x){return"<span class=\"badge\">"+esc(x)+"</span>";}).join("")+"</div><p>"+a.effectiveAssignmentCount+" habilitation(s) effective(s) — "+esc(a.temporalState)+"</p>"+action+"</article>";}).join("");}
function load(){shell.setAttribute("aria-busy","true");google.script.run.withSuccessHandler(render).withFailureHandler(fail).AKS_listAdminAccessAccounts(query());}
function requestId(){return"req-ui-"+Date.now()+"-"+Math.random().toString(36).slice(2);}
function command(name,payload){if(shell.getAttribute("aria-busy")==="true")return;shell.setAttribute("aria-busy","true");payload.expectedRevision=shell.dataset.revision;payload.requestId=requestId();google.script.run.withSuccessHandler(function(){message.textContent="Modification enregistrée.";message.className="success";load();}).withFailureHandler(fail)[name](payload);}
document.querySelectorAll(".toolbar input,.toolbar select").forEach(function(control){control.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(load,250);});});
document.getElementById("access-create").addEventListener("submit",function(e){e.preventDefault();if(!window.confirm("Créer ce compte inactif, sans habilitation ?"))return;command("AKS_createAdminAccessAccount",{displayName:this.elements.displayName.value,email:this.elements.email.value,role:this.elements.role.value});});
list.addEventListener("click",function(e){var button=e.target.closest("button[data-action]");if(!button)return;var card=button.closest("[data-id]"),id=decodeURIComponent(card.dataset.id),action=button.dataset.action;if(action==="deactivate"){if(window.confirm("Désactiver ce compte en conservant son historique ?"))command("AKS_deactivateAdminAccessAccount",{accountId:id});return;}var clear=Number(card.dataset.assignments)>0;if(window.confirm(clear?"Réactiver ce compte et effacer définitivement ses anciennes habilitations ?":"Réactiver ce compte sans habilitation ?"))command("AKS_reactivateAdminAccessAccount",{accountId:id,clearAssignments:clear});});load();
})();</script>
