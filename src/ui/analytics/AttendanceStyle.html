<style>

    --aks-surface: #ffffff;
    --aks-text: #172033;
    --aks-muted: #667085;
    --aks-border: #dfe4ec;
    --aks-focus: rgba(42, 75, 155, 0.32);
  }

  body {

    background: var(--aks-background);
    color: var(--aks-text);

    line-height: 1.5;
    -webkit-text-size-adjust: 100%;

    padding: 24px 0 48px;

  .aks-attendance-header { margin-bottom: 20px; }
  .aks-attendance-navigation { margin-bottom: 20px; }

    text-decoration: none;

    outline: 3px solid var(--aks-focus);
    outline-offset: 3px;
  }
  .aks-attendance-eyebrow {
    margin: 0 0 6px;
    color: var(--aks-primary);
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 7vw, 2.4rem); }
  h2 { margin: 0 0 16px; font-size: 1.15rem; }
  .aks-attendance-identity,

    color: #fff;
    font-weight: 700;

    color: #fff;
